
name: Docker Build and K8s Minikube Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
  runs-on: ubuntu-latest

  steps:
    - uses: actions/checkout@v3
    - name: Checkout code
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
    - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
    - name: Run tests
        working-directory: ./frontend
        run: npm test -- --passWithNoTests
    - name: Run build
        working-directory: ./frontend
        run: npm run build
    
  build-and-push:
    needs: [ build-and-deploy ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: login to Docker Hub
        uses: docker/login-actions@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dream_vacation_app_frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dream_vacation_app_frontend:${{ github.sha }}

            run: |
              SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-5)
              docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/dream-vacation-app_frontend:latest -t ${{ secrets.DOCKERHUB_USERNAME }}/dream-vacation-app_frontend:$SHORT_SHA frontend/
              docker push ${{ secrets.DOCKERHUB_USERNAME }}/dream-vacation-app_frontend:latest
              docker push ${{ secrets.DOCKERHUB_USERNAME }}/dream-vacation-app_frontend:$SHORT_SHA
 
  deploy:
    needs: [ build-and-push ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Start Minikube
        run: |
          curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          sudo install minikube-linux-amd64 /usr/local/bin/minikube
          minikube start --driver=docker

      - name: Deploy application
        with:
          context: ./kubernetes/frontend
          run: |
            if [[ $GITHUB_REF_NAME == 'develop' ]]; then
              NAMESPACE='dev';
            elif [[ $GITHUB_REF_NAME == 'main' ]]; then
              NAMESPACE='prod';
            else
              echo "Unknown branch, skipped.";
              exit 1;
            fi

            # Create namespace
            kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

            kubectl apply -f frontend-deployment.yml -n $NAMESPACE
            kubectl apply -f frontend-svc.yml -n $NAMESPACE

            # Wait for deployments
            kubectl rollout status deployment/frontend -n $NAMESPACE --timeout=180s

      - name: Get Minikube IP
        run: |
          echo "MINIKUBE_IP=$(minikube ip)" >> $GITHUB_ENV

      - name: Display Access URLs
        run: |
          echo "Frontend URL: http://$MINIKUBE_IP:$(kubectl get svc dreams-vacation-frontend-svc -n $NAMESPACE -o jsonpath='{.spec.ports[0].nodePort}')"


